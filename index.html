
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Energy Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f1f5f9; margin: 0; color: #1e293b; }
        header { background: #12304a; color: white; padding: 20px; text-align: center; }
        main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
        .buildings { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .card { background: white; padding: 20px; border-radius: 12px; }
        .number { font-size: 28px; font-weight: bold; }
        .warning { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; }
        .safe { background: #dcfce7; color: #166534; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>
<header>
    <h1>Smart Campus Energy Monitoring</h1>
    <p>Daily electricity consumption and energy-saving targets</p>
</header>
<main>
    <h2>Building-wise Consumption</h2>
    <section class="buildings" id="buildings"></section>
</main>
<script>
const buildings = [
    { name: "Academic Block", usage: 120, target: 90 },
    { name: "Library", usage: 75, target: 80 },
    { name: "Hostel", usage: 75, target: 80 }
];

document.getElementById("buildings").innerHTML = buildings.map(building => {
    const excess = building.usage - 100;
    const status = excess > 0
        ? `<p class="warning">Warning: Consumption exceeds 100 kWh by ${excess} kWh.</p>`
        : `<p class="safe">Within the 100 kWh daily limit.</p>`;

    return `
        <article class="card">
            <h3>${building.name}</h3>
            <p class="number">${building.usage} kWh</p>
            <p>Daily energy-saving target: ${building.target} kWh</p>
            ${status}
        </article>
    `;
}).join("");
</script>
</body>
</html>
