
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-energy
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: campus-energy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: campus-energy
    spec:
      containers:
        - name: dashboard
          image: docker.io/YOUR_DOCKERHUB_USERNAME/smart-campus-energy:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: campus-energy
spec:
  type: NodePort
  selector:
    app: campus-energy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
